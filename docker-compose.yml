# Ambiente do produto. Suba com ./scripts/up.sh e derrube com ./scripts/down.sh.
# Nenhuma chave de pagamento: o gateway é sempre o simulado (GATEWAY_MODE=simulated).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: catraca
      POSTGRES_PASSWORD: catraca
      POSTGRES_DB: catraca
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catraca -d catraca"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      target: runtime
    init: true
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://catraca:catraca@db:5432/catraca
      PARTNER_API_KEY: pk_test_catraca_parceiro
      GATEWAY_MODE: simulated
      GATEWAY_TIME_SCALE: "${GATEWAY_TIME_SCALE:-1}"
    ports:
      - "${CATRACA_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  db-data:
